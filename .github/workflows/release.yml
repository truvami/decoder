name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # matches both stable (v1.2.3) and RC (v1.2.3-rc1) tags
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: GoReleaser
    # Single workflow auto-detects RC vs stable from the tag, installs
    # cosign + syft (for dockers_v2 signing/SBOM) and publishes to GHCR.
    uses: truvami/ci-templates/.github/workflows/go-release.yml@v1
    with:
      go-version: '1.26'
      private-modules: false
    secrets: inherit
