# Build & push a single multi-arch OCI image from the prebuilt binaries above
# (no compile in the Dockerfile). https://goreleaser.com/customization/package/dockers_v2/
dockers_v2:
  - id: decoder
    ids:
      - decoder
    dockerfile: Dockerfile
    # Attach an SBOM to the image (syft). Default is true; set explicitly.
    sbom: "true"
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - ghcr.io/truvami/decoder
    tags:
      # Moving tags (latest/major/minor) only for stable releases — never let an
      # RC/prerelease move them. The immutable {{ .Tag }}/{{ .Version }} always apply.
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    annotations:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

# Write a digests file with the digests of all published images/manifests.
# https://goreleaser.com/customization/package/docker_digests/
docker_digest:
  name_template: "{{ .ProjectName }}-{{ .Version }}-digests.txt"

# Keyless (OIDC) signing of the dockers_v2 images with cosign. Requires
# `id-token: write` in the workflow and cosign installed on the runner (the
# ci-templates go-release workflow installs it). An empty `artifacts` targets
# images built by dockers_v2. https://goreleaser.com/customization/sign/docker_sign/
docker_signs:
  - id: decoder-keyless
    artifacts: ""
    cmd: cosign
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
    output: true

# Generate an SBOM artifact for the built binaries (syft is installed by the
# ci-templates go-release workflow). https://goreleaser.com/customization/sbom/
sboms:
  - id: binary
    artifacts: binary

changelog:
  sort: asc

