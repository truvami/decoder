version: 2

project_name: decoder

release:
  draft: false
  prerelease: "auto"

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: decoder
    binary: decoder
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/truvami/decoder/cmd.Version={{.Version}}
      - -X github.com/truvami/decoder/cmd.Commit={{.FullCommit}}
      - -X github.com/truvami/decoder/cmd.Date={{.Date}}
    goos:
      # Focus on the most common desktop/server operating systems
      - linux
      - darwin
      - windows
    goarch:
      # Focus on the most common architectures (64-bit primarily)
      - amd64
      - arm64

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

archives:
  - formats: [tar.gz]
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - README.md

